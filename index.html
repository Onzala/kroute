<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>韓國找路</title>
<meta name="theme-color" content="#16222E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="韓國找路">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：手機 App 殼層，上方標題、中間內容、下方分頁列；全部靠左對齊。
   記憶點只有一個：首爾地鐵「出口號碼」的黃底黑字方塊，用在出口備註與司機卡。 */
:root{
  --paper:#F5F7F6; --surface:#FFFFFF; --ink:#16222E; --ink-2:#4A5866; --line:#D6DDDA;
  --exit:#F2C300; --exit-ink:#111A22; --go:#16884E; --go-ink:#FFFFFF;
  --warn:#B4500F; --warn-bg:#FFF1E6; --ok-bg:#E7F5EC; --info-bg:#EEF2F6;
  --focus:#2F6FDE;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0F161C; --surface:#18222B; --ink:#E7ECEA; --ink-2:#A3B0BB; --line:#2A3743;
    --exit:#F2C300; --exit-ink:#111A22; --go:#2BAA66; --go-ink:#06140C;
    --warn:#F0A060; --warn-bg:#33210F; --ok-bg:#12291C; --info-bg:#1C2833;
    --focus:#7AA7FF; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-ui);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
[lang="ko"]{font-family:var(--f-ko);word-break:keep-all}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--focus)}

.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:#16222E;color:#F5F7F6;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.top .mark{width:22px;height:22px;border-radius:4px;background:var(--exit);color:var(--exit-ink);display:grid;place-items:center;font:700 13px/1 var(--f-ko)}
main{flex:1;width:100%;max-width:640px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:none;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
.tabs button[aria-selected="true"] svg{color:var(--go)}
.badge{min-width:18px;padding:0 5px;border-radius:9px;background:var(--exit);color:var(--exit-ink);font-size:11px;font-weight:700;line-height:18px}

.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-2);font-size:13px}
h2{margin:0;font-size:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
input[type=text],input[type=search],input[type=password],textarea,select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;font-size:16px}
textarea{min-height:76px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.go{background:var(--go);color:var(--go-ink);border-color:var(--go);font-weight:700}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.results button{all:unset;cursor:pointer;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.results button:last-child{border-bottom:0}
.results button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.results .n{font-weight:700}
.results .a{font-size:13px;color:var(--ink-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ko-name{font-size:24px;font-weight:700;line-height:1.3;margin:0}
.zh-name{font-size:14px;color:var(--ink-2)}
.addr{font-size:15px}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.check{border-radius:var(--r);padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.check.ok{background:var(--ok-bg)} .check.warn{background:var(--warn-bg);color:var(--warn)} .check.info{background:var(--info-bg)}
.check b{display:block}
.multi{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.multi summary{cursor:pointer;font-size:14px}
.multi .kv{grid-template-columns:6.5em 1fr}
.choose{display:flex;flex-direction:column;gap:6px}
.choose label{display:flex;gap:8px;align-items:center;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r)}
.map{height:200px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--info-bg)}

.exit{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:4px;background:var(--exit);color:var(--exit-ink);font:700 15px/1 var(--f-ko)}
.station{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}

.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .ko{font-size:19px;font-weight:700;line-height:1.3}
.item .flag{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.flag.ok{background:var(--ok-bg);color:var(--go)} .flag.warn{background:var(--warn-bg);color:var(--warn)}
.note{display:flex;gap:8px;align-items:center;font-size:14px}
.note input{padding:8px 10px;font-size:15px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:9;
  background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast a{color:var(--exit)}

.driver{position:fixed;inset:0;z-index:20;background:#FFFFFF;color:#111;display:flex;flex-direction:column;justify-content:center;gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px))}
.driver .ask{font:600 20px/1.4 var(--f-ko)}
.driver .dest{font:700 clamp(34px,10vw,60px)/1.2 var(--f-ko);word-break:keep-all}
.driver .daddr{font:600 22px/1.45 var(--f-ko)}
.driver .close{align-self:flex-start;border:2px solid #111;background:#fff;color:#111;border-radius:10px;padding:10px 16px;font-size:16px}
.sheet{position:fixed;inset:0;z-index:15;background:rgba(10,15,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
code{font-size:13px;background:var(--info-bg);padding:2px 6px;border-radius:5px;overflow-wrap:anywhere}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><span class="mark" lang="ko">길</span><h1>韓國找路</h1></header>

  <main>
    <!-- 搜尋 -->
    <section id="v-search" class="stack">
      <form id="searchForm" class="search" autocomplete="off">
        <input id="q" type="search" placeholder="輸入地點：中文、英文或韓文皆可" enterkeyhint="search" aria-label="搜尋地點">
        <button class="btn primary" type="submit">搜尋</button>
      </form>
      <details id="pasteBox">
        <summary class="muted">從 Google 地圖分享過來</summary>
        <div class="stack" style="margin-top:10px">
          <textarea id="paste" placeholder="在 Google 地圖按「分享」→「複製」，把整段文字貼在這裡"></textarea>
          <div class="row">
            <button class="btn" type="button" id="btnClip">從剪貼簿貼上</button>
            <button class="btn primary" type="button" id="btnParse">解析</button>
          </div>
        </div>
      </details>
      <div id="status" class="muted" aria-live="polite"></div>
      <div id="results" class="results" hidden></div>
      <div id="confirm"></div>
      <div id="needKeys" class="empty" hidden>
        <b>還沒設定金鑰</b>
        <span>搜尋要用到 Google 和 Kakao 的金鑰。到「設定」頁貼上後就能用。</span>
        <button class="btn primary" type="button" data-goto="settings">前往設定</button>
      </div>
    </section>

    <!-- 清單 -->
    <section id="v-list" class="stack" hidden>
      <div class="row" style="justify-content:space-between">
        <h2>我的地點</h2>
        <label class="row muted" for="startSel">出發地
          <select id="startSel" style="width:auto;padding:6px 8px;font-size:14px"></select>
        </label>
      </div>
      <div id="list" class="list"></div>
    </section>

    <!-- 設定 -->
    <section id="v-settings" class="stack" hidden>
      <div class="card">
        <h2>金鑰</h2>
        <label class="f" for="kGoogle">Google Maps 金鑰（API key）
          <input id="kGoogle" type="password" autocomplete="off" spellcheck="false">
        </label>
        <label class="f" for="kKakao">Kakao JavaScript 金鑰（JavaScript 키）
          <input id="kKakao" type="password" autocomplete="off" spellcheck="false">
        </label>
        <div class="row">
          <button class="btn primary" id="btnSaveKeys" type="button">儲存並測試</button>
          <button class="btn" id="btnShowKeys" type="button">顯示金鑰</button>
        </div>
        <div id="keyTest" class="muted" aria-live="polite"></div>
        <p class="muted" style="margin:0">金鑰只存在這支手機的瀏覽器裡，不會上傳到 GitHub。</p>
      </div>
      <div class="card">
        <h2>版本</h2>
        <p class="muted" style="margin:0">目前版本：<b id="appVer"></b>。更新後若仍是舊版，把 App 完全關掉再開一次。</p>
      </div>
      <div class="card">
        <h2>本站網址</h2>
        <p class="muted" style="margin:0">Google 金鑰的「網站限制」和 Kakao 的「Web 平台網域」都要填這個網址。</p>
        <div class="row"><code id="origin"></code><button class="btn small" type="button" id="btnCopyOrigin">複製</button></div>
      </div>
      <div class="card">
        <h2>備份</h2>
        <p class="muted" style="margin:0">清單存在這支手機的瀏覽器裡。清除瀏覽資料會一起清掉，出發前建議先匯出一份。</p>
        <div class="row">
          <button class="btn" type="button" id="btnExport">匯出清單</button>
          <label class="btn" for="importFile">匯入清單</label>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabs" role="tablist" aria-label="分頁">
    <button role="tab" data-tab="search" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>搜尋</button>
    <button role="tab" data-tab="list" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></svg>
      <span class="row" style="gap:4px">清單<span id="count" class="badge" hidden></span></span></button>
    <button role="tab" data-tab="settings" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>設定</button>
  </nav>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script>
'use strict';
/* ======================= 儲存 ======================= */
const APP_VERSION='v0.4.0';
const K_PLACES='kroute.places.v1', K_KEYS='kroute.keys.v1', K_START='kroute.start.v1';
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('無法儲存：瀏覽器拒絕寫入（可能是無痕模式）');return false}}
};
let places=store.get(K_PLACES,[]);
let keys=store.get(K_KEYS,{google:'',kakao:''});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAndroid=/Android/i.test(navigator.userAgent);

/* ======================= 小工具 ======================= */
let toastTimer;
function toast(html,ms=3200){const t=$('#toast');t.innerHTML=html;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,ms)}
function setStatus(html){$('#status').innerHTML=html||''}
function haversine(a,b){const R=6371000,r=x=>x*Math.PI/180;const dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function fmtDist(m){return m<1000?Math.round(m)+' 公尺':(m/1000).toFixed(1)+' 公里'}
function norm(s){return String(s||'').toLowerCase().replace(/[\s\(\)\[\]（）·・,，.\-_'"]/g,'')}
function nameSim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 1;if(a.includes(b)||b.includes(a))return .9;
  const bg=s=>{const m=new Map();for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);m.set(g,(m.get(g)||0)+1)}return m};
  const A=bg(a),B=bg(b);let inter=0,n=0;A.forEach((v,k)=>{inter+=Math.min(v,B.get(k)||0);n+=v});B.forEach(v=>n+=v);return n?2*inter/n:0}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('已複製')}catch(e){toast('無法自動複製，請長按文字複製')}}
const hasHan=s=>/[㐀-鿿]/.test(s||''), hasHangul=s=>/[가-힣]/.test(s||'');
// 韓文 → 羅馬拼音（國語羅馬字，逐字轉寫＋基本連音），只供核對招牌、路標用，不是官方英文名
const RR_I=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
const RR_V=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
const RR_F=['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
const RR_LINK={1:'g',2:'kk',4:'n',7:'d',8:'r',16:'m',17:'b',19:'s',20:'ss',22:'j',23:'ch',24:'k',25:'t',26:'p',27:''};
function romanize(str){
  const ch=[...String(str||'')];let out='',skipIni=false;
  for(let i=0;i<ch.length;i++){
    const c=ch[i].charCodeAt(0)-0xAC00;
    if(c<0||c>11171){out+=ch[i];skipIni=false;continue}
    const ini=Math.floor(c/588), med=Math.floor(c%588/28), fin=c%28;
    out+=(skipIni?'':RR_I[ini])+RR_V[med];skipIni=false;
    if(!fin)continue;
    const n=(ch[i+1]||'').charCodeAt(0)-0xAC00, nIni=n>=0&&n<=11171?Math.floor(n/588):-1;
    if(nIni===11&&fin in RR_LINK)out+=RR_LINK[fin];          // 連音：받침＋ㅇ
    else if(fin===8&&nIni===5){out+='ll';skipIni=true}        // ㄹ＋ㄹ → ll
    else out+=RR_F[fin];
  }
  return out.replace(/\S+/g,w=>w.charAt(0).toUpperCase()+w.slice(1));
}
// 名稱可能是「A & B」「A(B)」之類的合寫，拆開來分別比對
function nameParts(s){return [...new Set(String(s||'').split(/\s*(?:&|＆|\/|·|,|，|\(|\)|（|）)\s*/).map(x=>x.trim()).filter(x=>norm(x).length>=2&&norm(x)!==norm(s)))]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ======================= 載入 Google / Kakao ======================= */
let gReady=null,kReady=null,gAuthBad=false;
function loadGoogle(){
  if(gAuthBad)return Promise.reject(new Error('Google 金鑰無效或網址未授權'));
  if(gReady)return gReady;
  if(!keys.google)return Promise.reject(new Error('NO_KEY'));
  gReady=new Promise((resolve,reject)=>{
    // gm_authFailure 可能在載入成功之後才觸發，所以另外記一個旗標
    window.gm_authFailure=()=>{gAuthBad=true;reject(new Error('Google 金鑰無效或網址未授權'))};
    // Google 官方動態載入程式碼

const KOREA_BOUNDS={south:33.0,west:124.5,north:38.7,east:131.0};

async function googleSearch(text,bias){
  const {Place}=await loadGoogle();
  const req={textQuery:text,fields:['id','displayName','formattedAddress','location','primaryTypeDisplayName'],language:'zh-TW',region:'kr',maxResultCount:8};
  if(bias)req.locationBias={center:bias,radius:300}; else req.locationRestriction=KOREA_BOUNDS;

  return (res||[]).map(p=>({id:p.id,name:p.displayName,addr:p.formattedAddress,type:p.primaryTypeDisplayName||'',lat:p.location.lat(),lng:p.location.lng()}));
}
async function googleKo(id){

  const e=new Place({id,requestedLanguage:'en',requestedRegion:'kr'}); // 英文名稱與地址，供多重比對

// Google 沒有中文／英文名稱時，用 Cloud Translation API 翻譯韓文名稱，只供理解意思；導航與司機卡仍用韓文原名。
// 需在 Google Cloud 啟用「Cloud Translation API」並加入金鑰的 API 限制；未啟用時顯示提示，不影響其他功能。
const mtCache=new Map();
async function machineTranslate(text,target){
  const ck=target+'|'+text;if(mtCache.has(ck))return mtCache.get(ck);
  const r=await fetch('https://translation.googleapis.com/language/translate/v2',{method:'POST',
    headers:{'Content-Type':'application/json','X-Goog-Api-Key':keys.google},
    body:JSON.stringify({q:text,source:'ko',target,format:'text'})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error&&j.error.message||('HTTP '+r.status));e.status=r.status;throw e}
  const out=j.data.translations[0].translatedText;mtCache.set(ck,out);return out;
}
function mtErrText(e){return e&&e.status===403?'Cloud Translation API 未啟用或金鑰未授權（選用功能）':'翻譯失敗：'+(e&&e.message||e)}

function kPromise(fn){return new Promise(res=>fn((data,status)=>res(status===kakao.maps.services.Status.OK?data:[])))}
async function kakaoCheck(koName,lat,lng){
  await loadKakao();
  const ps=new kakao.maps.services.Places(), geo=new kakao.maps.services.Geocoder();
  const here=new kakao.maps.LatLng(lat,lng), S=kakao.maps.services.SortBy;
  const near=await kPromise(cb=>ps.keywordSearch(koName,cb,{location:here,radius:2000,sort:S.DISTANCE,size:5}));
  const parts=nameParts(koName);let byPart=[];
  if(!near.some(d=>nameSim(koName,d.place_name)>=.5))
    for(const w of parts)byPart.push(...await kPromise(cb=>ps.keywordSearch(w,cb,{location:here,radius:2000,sort:S.DISTANCE,size:5})));
  let wide=[];
  if(!near.length&&!byPart.length)wide=await kPromise(cb=>ps.keywordSearch(koName,cb,{size:5}));
  const addrs=await kPromise(cb=>geo.coord2Address(lng,lat,cb));
  const stations=await kPromise(cb=>ps.categorySearch('SW8',cb,{location:here,radius:1500,sort:S.DISTANCE,size:3}));
  const seen=new Set();
  const cand=[...near,...byPart,...wide].filter(d=>!seen.has(d.id)&&seen.add(d.id)).map(d=>({name:d.place_name,road:d.road_address_name,jibun:d.address_name,lat:+d.y,lng:+d.x,url:d.place_url,
    cat:d.category_name||'',dist:haversine({lat,lng},{lat:+d.y,lng:+d.x}),
    sim:Math.max(nameSim(koName,d.place_name),...parts.map(w=>nameSim(w,d.place_name)*.95))}));
  cand.sort((a,b)=>(b.sim-a.sim)||(a.dist-b.dist));
  let best=cand[0]||null, verdict;
  const closeNamed=cand.find(c=>c.sim>=.5&&c.dist<=150);
  const closeAny=[...cand].sort((a,b)=>a.dist-b.dist).find(c=>c.dist<=60);
  if(closeNamed){best=closeNamed;verdict='ok'}
  else if(closeAny){best=closeAny;verdict='rename'}
  else if(best&&best.sim>=.5){verdict='far'}
  else{best=null;verdict='none'}
  const a0=addrs[0]||{};
  return {verdict,best,
    road:a0.road_address?a0.road_address.address_name:'', jibun:a0.address?a0.address.address_name:'',
    stations:stations.map(s=>({name:s.place_name,dist:haversine({lat,lng},{lat:+s.y,lng:+s.x})}))};
}

/* ======================= Google 分享連結解析 ======================= */
function parseShare(raw){
  const text=String(raw||'').trim();
  const urls=text.match(/https?:\/\/\S+/g)||[];
  let lat=null,lng=null,name='';
  for(const u0 of urls){
    let u=u0;try{u=decodeURIComponent(u0)}catch(e){}
    let m;
    if((m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/))){lat=+m[1];lng=+m[2]}
    else if((m=u.match(/[?&](?:q|query|ll|center|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/))){lat=+m[1];lng=+m[2]}
    else if((m=u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/))){lat=+m[1];lng=+m[2]}
    if((m=u.match(/\/place\/([^\/@?]+)/)))name=m[1].replace(/\+/g,' ');
    else if(!name&&(m=u.match(/[?&](?:q|query)=([^&]+)/))&&!/^-?\d+\.\d+,/.test(m[1]))name=m[1].replace(/\+/g,' ');
  }
  if(!name){
    const rest=text.replace(/https?:\/\/\S+/g,'').split(/\n/).map(s=>s.trim()).filter(Boolean);
    if(rest.length)name=rest[0];
  }
  const shortOnly=!name&&lat===null&&urls.some(u=>/goo\.gl|maps\.app/.test(u));
  return {name:name.trim(),lat,lng,shortOnly};
}

      for(const it of items){for(const t of ['text/uri-list','text/plain','text/html']){if(it.types.includes(t)){txt=await (await it.getType(t)).text();break}}if(txt)break}
    }else if(navigator.clipboard&&navigator.clipboard.readText){txt=await navigator.clipboard.readText()}
    if(!txt){toast('剪貼簿是空的');return}

function handleShare(raw){
  const p=parseShare(raw);
  if(p.shortOnly){setStatus('這是 Google 短網址，手機端無法直接解開。請在 Google 地圖按「分享」時選「複製」整段文字（會帶地點名稱），或直接在上方輸入名稱。');return}
  if(!p.name&&p.lat===null){setStatus('看不出地點資訊。請貼上 Google 地圖分享的整段文字。');return}
  if(p.name){$('#q').value=p.name;runSearch(p.name,p.lat!==null?{lat:p.lat,lng:p.lng}:null)}
  else coordOnly(p.lat,p.lng);
}

/* ======================= 只有座標的分享（T5） ======================= */
// 用 Kakao 反查地址與附近地點，列出候選讓使用者確認；選定後再回到 Google 取中文名與韓文資料。
async function kakaoGuess(lat,lng){
  await loadKakao();
  const ps=new kakao.maps.services.Places(), geo=new kakao.maps.services.Geocoder();
  const here=new kakao.maps.LatLng(lat,lng), S=kakao.maps.services.SortBy;
  const addrs=await kPromise(cb=>geo.coord2Address(lng,lat,cb));
  const a0=addrs[0]||{}, ra=a0.road_address, ja=a0.address;
  const building=ra&&ra.building_name||'';
  const road=ra?ra.address_name:'', jibun=ja?ja.address_name:'';
  const found=[];
  const kw=[...new Set([building,road].filter(Boolean))];
  for(const w of kw)found.push(...await kPromise(cb=>ps.keywordSearch(w,cb,{location:here,radius:200,sort:S.DISTANCE,size:5})));
  for(const cat of ['AT4','AD5','CT1','PO3','SW8'])
    found.push(...await kPromise(cb=>ps.categorySearch(cat,cb,{location:here,radius:80,sort:S.DISTANCE,size:3})));
  const seen=new Set(), out=[];
  for(const d of found){if(seen.has(d.id))continue;seen.add(d.id);
    out.push({name:d.place_name,addr:d.road_address_name||d.address_name,lat:+d.y,lng:+d.x,dist:haversine({lat,lng},{lat:+d.y,lng:+d.x})})}
  out.sort((a,b)=>a.dist-b.dist);
  const list=out.filter(c=>c.dist<=200).slice(0,7);
  // 最後一筆：不指定地點，直接用座標（名稱用建物名或地址）
  const label=building||road||jibun;
  if(label)list.push({name:label,addr:road||jibun,lat,lng,dist:0,raw:true});
  return list;
}
async function coordOnly(lat,lng){
  if(!keysOk()){showNeedKeys();return}
  if(!navigator.onLine){setStatus('目前沒有網路，無法解析座標。');return}
  $('#confirm').innerHTML='';$('#results').hidden=true;
  setStatus('<span class="spin"></span> 連結裡只有座標，正在用 Kakao 推測地點…');
  try{
    const list=await kakaoGuess(lat,lng);
    if(!list.length){setStatus('這個座標附近查不到地點或地址。請在上方輸入名稱搜尋。');return}
    setStatus('連結裡只有座標。下面是這個位置附近的地點，點選正確的一筆：');
    const box=$('#results');box.innerHTML='';
    list.forEach(c=>{const b=document.createElement('button');b.type='button';
      b.innerHTML='<span class="n" lang="ko">'+esc(c.name)+'</span><span class="a">'+(c.raw?'直接使用分享的座標':'<span lang="ko">'+esc(c.addr)+'</span> · 距離 '+fmtDist(c.dist))+'</span>';
      b.addEventListener('click',()=>pickGuess(c));box.appendChild(b)});
    box.hidden=false;
  }catch(err){setStatus(errMsg(err))}
}
async function pickGuess(c){
  $('#results').hidden=true;setStatus('<span class="spin"></span> 向 Google 查詢這個地點…');
  try{
    const res=await googleSearch(c.name,{lat:c.lat,lng:c.lng});
    const near=res.map(r=>({...r,d:haversine(c,r)})).sort((a,b)=>a.d-b.d)[0];
    if(near&&near.d<=200){$('#q').value=near.name;return pick(near)}
    // Google 附近沒有對應地點：只用 Kakao 資料
    setStatus('<span class="spin"></span> Google 查無對應地點，改用 Kakao 資料…');
    const chk=await kakaoCheck(c.name,c.lat,c.lng);
    current={src:'kakao',zh:c.name,g:{name:c.name,lat:c.lat,lng:c.lng,url:'https://www.google.com/maps/search/?api=1&query='+c.lat+','+c.lng},chk};
    setStatus('');renderConfirm();
  }catch(err){setStatus(errMsg(err))}
}

/* ======================= Android 分享進來（T4） ======================= */
// manifest 的 share_target 以 GET 開啟 ./?share_title=…&share_text=…&share_url=…
function takeShared(){
  const sp=new URLSearchParams(location.search);
  const parts=['share_title','share_text','share_url'].map(k=>sp.get(k)).filter(Boolean);
  if(!parts.length)return false;
  history.replaceState(null,'',location.pathname);
  const txt=parts.join('\n');
  go('search');$('#pasteBox').open=true;$('#paste').value=txt;
  if(!keysOk()){setStatus('收到分享的地點，但還沒設定金鑰。設定好後回到這裡按「解析」。');return true}
  handleShare(txt);return true;
}

/* ======================= 清單 ======================= */
function renderStartSel(){
  const sel=$('#startSel');const cur=store.get(K_START,'');
  sel.innerHTML='<option value="">目前位置</option>'+places.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===cur?' selected':'')+'>'+esc(p.zh||p.zhMT||p.en||p.ko)+'</option>').join('');
}
$('#startSel').addEventListener('change',e=>store.set(K_START,e.target.value));
function renderList(){
  const n=places.length;const c=$('#count');c.hidden=!n;c.textContent=n;
  renderStartSel();
  const box=$('#list');
  if(!n){box.innerHTML='<div class="empty"><b>清單還是空的</b><span>在「搜尋」頁找到地點並確認後，按「存進清單」就會出現在這裡。</span><button class="btn primary" type="button" data-goto="search">去搜尋</button></div>';return}
  box.innerHTML=places.map(p=>{
    const flag=p.verdict==='ok'?'<span class="flag ok">雙方一致</span>':'<span class="flag warn">'+({rename:'名稱有差異',far:'位置有差異',none:'僅 Google',kakao:'僅 Kakao'}[p.verdict]||'待確認')+'</span>';
    const exitNum=((p.note||"").match(/(\d+)\s*號?\s*(出口|출구)/)||[])[1];
    return '<article class="item" data-id="'+esc(p.id)+'">'+
      '<div class="head"><div style="min-width:0"><div class="ko" lang="ko">'+esc(p.ko)+'</div><div class="muted">'+esc([p.zh||(p.zhMT?p.zhMT+'（機翻）':''),p.en||p.enMT].filter(Boolean).join(' · ')||romanize(p.ko))+'</div></div>'+flag+'</div>'+
      (p.road||p.jibun?'<div class="addr" lang="ko">'+esc(p.road||p.jibun)+'</div>':'')+
      (p.stations&&p.stations.length?'<div class="station">'+(exitNum?'<span class="exit" aria-label="'+exitNum+' 號出口">'+exitNum+'</span>':'')+'<span lang="ko">'+esc(p.stations[0].name)+'</span><span class="muted">直線 '+fmtDist(p.stations[0].dist)+'</span></div>':'')+
      '<div class="note"><input type="text" value="'+esc(p.note)+'" placeholder="出口備註，例：3 號出口" data-act="note" aria-label="出口備註"></div>'+
      '<div class="row"><span class="muted">Naver 路線</span><div class="seg" role="group" aria-label="交通方式">'+
        '<button type="button" data-act="nv" data-mode="public">大眾運輸</button><button type="button" data-act="nv" data-mode="walk">步行</button><button type="button" data-act="nv" data-mode="car">開車</button></div></div>'+
      '<div class="actions">'+
        '<button class="btn small" type="button" data-act="driver">給司機看</button>'+
        '<button class="btn small" type="button" data-act="copy">複製韓文地址</button>'+
        '<a class="btn small" target="_blank" rel="noopener" href="'+naverWebUrl(p)+'">Naver 網頁版</a>'+
        '<a class="btn small" target="_blank" rel="noopener" href="'+kakaoWebUrl(p)+'">Kakao 路線</a>'+
        '<button class="btn small danger" type="button" data-act="del">刪除</button>'+
      '</div></article>'}).join('');
}
$('#list').addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]');if(!btn)return;
  const id=btn.closest('.item')?.dataset.id;const p=places.find(x=>x.id===id);if(!p)return;
  const act=btn.dataset.act;
  if(act==='nv')openNaver(p,btn.dataset.mode);
  else if(act==='copy')copyText(p.ko+'\n'+(p.road||p.jibun||''));
  else if(act==='driver')showDriver(p);
  else if(act==='del')confirmDelete(p);
});
$('#list').addEventListener('change',e=>{
  if(e.target.dataset.act!=='note')return;
  const id=e.target.closest('.item').dataset.id;const p=places.find(x=>x.id===id);if(!p)return;
  p.note=e.target.value.trim();store.set(K_PLACES,places);renderList();toast('已更新備註');
});

/* ======================= Naver / Kakao 開啟 ======================= */
function q(params){return Object.entries(params).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')}
function naverParams(p){
  const sid=store.get(K_START,'');const s=sid&&sid!==p.id?places.find(x=>x.id===sid):null;
  const o={};
  if(s){o.slat=s.lat;o.slng=s.lng;o.sname=s.ko}
  o.dlat=p.lat;o.dlng=p.lng;o.dname=p.ko;o.appname=location.origin;
  return q(o);
}
function openNaver(p,mode){
  const qs=naverParams(p);
  const url=isAndroid
    ?'intent://route/'+mode+'?'+qs+'#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end'
    :'nmap://route/'+mode+'?'+qs;
  let left=false;const onHide=()=>{if(document.hidden)left=true};
  document.addEventListener('visibilitychange',onHide);
  location.href=url;
  setTimeout(()=>{document.removeEventListener('visibilitychange',onHide);
    if(!left&&!isAndroid)toast('沒有開啟 Naver Map？可能尚未安裝。<a href="https://apps.apple.com/app/id311867728" target="_blank" rel="noopener">下載 App</a> 或改按「Naver 網頁版」',6000)},1800);
}
function naverWebUrl(p){return 'https://map.naver.com/p/search/'+encodeURIComponent(p.ko)}
function kakaoWebUrl(p){return 'https://map.kakao.com/link/to/'+encodeURIComponent(String(p.ko).replace(/,/g,' '))+','+p.lat+','+p.lng}

/* ======================= 司機卡、刪除確認 ======================= */
function showDriver(p){
  const d=document.createElement('div');d.className='driver';d.setAttribute('role','dialog');d.setAttribute('aria-label','給司機看');
  d.innerHTML='<p class="ask" lang="ko">기사님, 여기로 가 주세요.</p><p class="dest" lang="ko">'+esc(p.ko)+'</p>'+
    (p.road||p.jibun?'<p class="daddr" lang="ko">'+esc(p.road||p.jibun)+'</p>':'')+
    '<button class="close" type="button">關閉</button>';
  let lock=null;
  d.querySelector('.close').addEventListener('click',()=>{d.remove();if(lock)lock.release().catch(()=>{})});
  document.body.appendChild(d);d.querySelector('.close').focus();
  if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>lock=l).catch(()=>{});
}
function confirmDelete(p){
  const s=document.createElement('div');s.className='sheet';
  s.innerHTML='<div class="panel" role="dialog" aria-label="確認刪除"><b>刪除「<span lang="ko">'+esc(p.ko)+'</span>」？</b><span class="muted">刪除後無法復原，除非你有匯出的備份。</span>'+
    '<div class="row"><button class="btn danger" type="button" data-x="yes">刪除</button><button class="btn" type="button" data-x="no">取消</button></div></div>';
  s.addEventListener('click',e=>{const x=e.target.dataset.x;if(e.target===s||x==='no')s.remove();
    if(x==='yes'){places=places.filter(i=>i.id!==p.id);store.set(K_PLACES,places);renderList();s.remove();toast('已刪除')}});
  document.body.appendChild(s);s.querySelector('[data-x=no]').focus();
}

/* ======================= 設定 ======================= */
$('#kGoogle').value=keys.google;$('#kKakao').value=keys.kakao;
$('#origin').textContent=location.origin;$('#appVer').textContent=APP_VERSION;
$('#btnCopyOrigin').addEventListener('click',()=>copyText(location.origin));
$('#btnShowKeys').addEventListener('click',e=>{const show=$('#kGoogle').type==='password';
  $('#kGoogle').type=$('#kKakao').type=show?'text':'password';e.target.textContent=show?'隱藏金鑰':'顯示金鑰'});
$('#btnSaveKeys').addEventListener('click',async()=>{
  const ng=$('#kGoogle').value.trim(), nk=$('#kKakao').value.trim();
  const changed=ng!==keys.google||nk!==keys.kakao;
  keys={google:ng,kakao:nk};store.set(K_KEYS,keys);showNeedKeys();
  if(changed&&(window.google||window.kakao)){$('#keyTest').textContent='已儲存。金鑰有變更，正在重新載入頁面…';setTimeout(()=>location.reload(),900);return}
  const out=[];$('#keyTest').innerHTML='<span class="spin"></span> 測試中…';
  try{const r=await googleSearch('Seoul Station');out.push(r.length?'Google：正常':'Google：連上了，但搜尋沒有結果')}catch(e){out.push('Google：'+(e.message==='NO_KEY'?'未填':e.message))}
  try{await loadKakao();const r=await kakaoCheck('서울역',37.5547,126.9707);out.push(r.stations.length||r.road?'Kakao：正常':'Kakao：連上了，但查不到資料，請確認「카카오맵」已啟用')}catch(e){out.push('Kakao：'+(e.message==='NO_KEY'?'未填':e.message))}
  try{const t=await machineTranslate('서울역','zh-TW');out.push('翻譯（選用）：正常（서울역 → '+t+'）')}catch(e){out.push('翻譯（選用）：'+mtErrText(e))}
  $('#keyTest').innerHTML=out.map(esc).join('<br>');
});
$('#btnExport').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({app:'kroute',v:1,exported:new Date().toISOString(),places},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='韓國找路_清單_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
});
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const data=JSON.parse(await f.text());const arr=Array.isArray(data)?data:data.places;
    if(!Array.isArray(arr))throw new Error('格式不符');
    const ids=new Set(places.map(p=>p.id));let add=0;
    arr.forEach(p=>{if(p&&p.id&&p.ko&&typeof p.lat==='number'&&!ids.has(p.id)){places.push(p);add++}});
    store.set(K_PLACES,places);renderList();toast('已匯入 '+add+' 筆（重複的略過）');
  }catch(err){toast('匯入失敗：檔案不是本 App 匯出的清單')}
  e.target.value='';
});

/* ======================= 分頁切換 ======================= */
function go(tab){
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  ['search','list','settings'].forEach(t=>$('#v-'+t).hidden=t!==tab);
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-goto]');if(t)go(t.dataset.tab||t.dataset.goto)});

renderList();showNeedKeys();
if(!keysOk())go('settings');
takeShared();

/* ======================= 離線（T3） ======================= */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.addEventListener('offline',()=>toast('已離線：清單、韓文地址、給司機看仍可使用'));
window.addEventListener('online',()=>toast('已恢復連線'));
</script>
